name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "blume.config.ts"
      - "docs-site-config.ts"
      - "theme.css"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "bin/check-docs-site"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: bun run docs:build
        env:
          KOTOBA_DOCS_BASE: /${{ github.event.repository.name }}
          KOTOBA_DOCS_REPO: ${{ github.repository }}
      - run: bun run docs:check
      - run: bin/check-docs-site dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true
